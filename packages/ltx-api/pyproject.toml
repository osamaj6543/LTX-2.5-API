[project]
name = "ltx-api"
version = "0.1.0"
description = "FastAPI server wrapping the official LTX-2 DistilledPipeline and TI2VidTwoStagesPipeline CLIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ltx-pipelines",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
